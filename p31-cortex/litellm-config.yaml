model_list:
  - model_name: phos-cognitive-core
    litellm_params:
      model: ollama/qwen2.5-coder:7b
      api_base: http://ollama-backend:11434
      tpm: 100000
      rpm: 1000

  - model_name: phos-fast-buffer
    litellm_params:
      model: ollama/llama3.2:3b
      api_base: http://ollama-backend:11434
      tpm: 150000
      rpm: 2000

  - model_name: phos-vector-embed
    litellm_params:
      model: ollama/nomic-embed-text
      api_base: http://ollama-backend:11434

litellm_settings:
  drop_params: true
  set_verbose: false
  telemetry: false

router_settings:
  routing_strategy: latency-based-routing
  enable_fallbacks: true
  model_fallbacks:
    - phos-cognitive-core: ["phos-fast-buffer"]