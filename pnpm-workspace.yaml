# P31 Andromeda — single workspace root (pnpm)
# All install/build/test for JS/TS runs from repository root unless a package README says otherwise.

# Link every workspace package into the root node_modules. Required for the
# canon shipped-gate (validate-contracts.mjs resolves
# workspaceRoot/node_modules/@scope/pkg for status: 'shipped') and for sibling
# packages to import each other without an explicit dependency relationship.
linkWorkspacePackages: true

packages:
  # PHOS v2 — standalone Astro PWA (not under software/)
  - 'phos'
  # Turbo orchestrator (must be listed — software/* does not match this folder)
  - 'software'
  # Core applications & services (software top-level packages)
  - 'software/*'
  - 'software/workers/mcp-x402-gateway'
  - 'software/workers/intent-resolver'
  - 'software/workers/creation-accountant'
  - 'software/workers/agent-runtime'
  - 'software/workers/care-mesh'
  - 'software/workers/p31-mcp-server'
  - 'software/workers/ledger-bridge'
  - 'software/workers/personal-swarm'
  # Shared libraries & VS Code extensions
  - 'software/packages/*'
  - 'software/extensions/*'
  # Repo-root shared packages (design-system, ui, etc.)
  - 'packages/*'
  # Nested app (PWA under node-zero)
  - 'software/packages/node-zero/pwa'
  # Workers grouped under cloudflare-worker and discord
  - 'software/cloudflare-worker/*'
  - 'software/discord/*'
  # Landing site nested under spaceship-earth
  - 'software/spaceship-earth/astro-landing'
  # P31 portals (production/) — hybrid protocol: vendored tarballs for @p31 deps, workspace:* for dev
  - '../../production/portals/*'
  # Canonical frontend apps
  - 'apps/phos'
  - 'apps/p31ca'
  - 'apps/phosphorus31'
  - 'apps/willow'
  - 'apps/gateway'
  - 'apps/counterscale'
  - 'apps/bonding'
  - 'apps/auth'
  - 'apps/status'
  - 'apps/design-hub'
  - 'apps/loom'
  # Repo-root satellite packages
  - 'cli'
  - 'p31labs/*'
  - 'phosphorus31.org/planetary-planet'
  - 'ecosystem/*'

overrides:
  "@types/three": "0.185.4"
  "three": "0.185.1"
  "@types/react": "19.2.14"
  "@types/react-dom": "19.2.3"
  "react": "18.3.1"
  "react-dom": "18.3.1"
