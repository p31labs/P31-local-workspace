[package]
name = "sovereign-core"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2.84"
wasm-bindgen-futures = "0.4.42"
js-sys = "0.3.69"
serde = { version = "1.0", features = ["derive"] }
serde-wasm-bindgen = "0.5"
serde_json = "1.0"
futures-util = "0.3"
reqwest = { version = "0.12", features = ["json", "blocking"] }
url = "2.5"
log = "0.4"
console_log = "1.0"
web-sys = { version = "0.3", features = ["console", "Window", "Response", "RequestInit", "RequestMode"] }
