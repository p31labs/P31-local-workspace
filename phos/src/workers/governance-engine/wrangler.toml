name = "governance-engine"
main = "index.ts"
compatibility_date = "2026-01-01"

[placement]
mode = "smart"

[env.production]
retries = 3

[env.staging]
retries = 3

[[d1_databases]]
binding = "GOVERNANCE_DB"
database_name = "governance-db"
database_id = "f05c8f18-a419-440c-a4e4-fe7da18dd7ae"

[durable_objects]
bindings = [
  { name = "GOVERNANCE_ENGINE", class_name = "GovernanceEngine" },
  { name = "TALLY_ROOM", class_name = "TallyRoom" }
]

[[migrations]]
tag = "v1"
new_sqlite_classes = ["GovernanceEngine"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["TallyRoom"]

[observability]
enabled = true
