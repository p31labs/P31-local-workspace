name = "mcp-x402-gateway"
main = "src/index.ts"
compatibility_date = "2026-01-01"

# L3.2 — x402 payment middleware mapped to local Base testnet (fallback).
# NETWORK defaults to base-sepolia (testnet). Set FACILITATOR_KEY_ID +
# FACILITATOR_SECRET_KEY (mainnet CDP auth) to switch to production settlement.
[vars]
NETWORK = "base-sepolia"
PAY_TO = "0xPAY_TO_RECEIVER"
FACILITATOR_URL = "https://facilitator.x402.org"
BILLING_INGEST_URL = "https://taler-bridge-billing.p31ca.org/api/revenue/ingest"

# Secrets (wrangler secret put), never in code:
# FACILITATOR_KEY_ID, FACILITATOR_SECRET_KEY, REVENUE_API_TOKEN

[observability]
enabled = true
