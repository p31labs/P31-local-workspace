<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>P31 — Wye to Delta</title>
<script src="./state.js"></script>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { height: 100%; overflow: hidden; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif; -webkit-tap-highlight-color: transparent; }
body { display: flex; flex-direction: column; }

.doors { display: flex; flex-direction: column; height: 100%; }

.door { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; cursor: pointer; transition: all 0.3s; text-decoration: none; position: relative; overflow: hidden; }
.door:active { transform: scale(0.97); }

.door-warm { background: linear-gradient(145deg, #FFF7ED 0%, #FED7AA 40%, #FCA5A5 100%); color: #7C2D12; }
.door-warm .icon { font-size: min(30vw, 160px); animation: pulseHeart 2s ease-in-out infinite; }
.door-warm .label { font-size: min(6vw, 32px); font-weight: 700; margin-top: 8px; letter-spacing: 0.02em; }
.door-warm .sub { font-size: min(3.5vw, 18px); opacity: 0.7; margin-top: 4px; }

.door-sparkle { background: linear-gradient(135deg, #E0F2FE 0%, #C084FC 40%, #F0ABFC 100%); color: #4C1D95; }
.door-sparkle .icon { font-size: min(30vw, 160px); animation: bounceStar 1.5s ease-in-out infinite; }
.door-sparkle .label { font-size: min(6vw, 32px); font-weight: 700; margin-top: 8px; letter-spacing: 0.02em; }
.door-sparkle .sub { font-size: min(3.5vw, 18px); opacity: 0.7; margin-top: 4px; }

@keyframes pulseHeart { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.08); } }
@keyframes bounceStar { 0%, 100% { transform: translateY(0) rotate(0deg); } 25% { transform: translateY(-8px) rotate(5deg); } 50% { transform: translateY(0) rotate(0deg); } 75% { transform: translateY(-4px) rotate(-5deg); } }

@media (min-width: 600px) {
  .doors { flex-direction: row; }
}

.no-js { display: none; }
</style>
</head>
<body>
<noscript>
  <div class="doors">
    <a href="warm/" class="door door-warm" style="display:flex">
      <div class="icon">❤️</div>
      <div class="label">Warm Door</div>
      <div class="sub">For family</div>
    </a>
    <a href="sparkle/" class="door door-sparkle" style="display:flex">
      <div class="icon">✨</div>
      <div class="label">Sparkle Door</div>
      <div class="sub">For play</div>
    </a>
  </div>
</noscript>

<div class="doors" id="doors">
  <a href="warm/" class="door door-warm" onclick="window.__onboard.door('warm'); window.__sfx.heart();">
    <div class="icon">❤️</div>
    <div class="label">Warm Door</div>
    <div class="sub">For family</div>
  </a>
  <a href="sparkle/" class="door door-sparkle" onclick="window.__onboard.door('sparkle'); window.__sfx.sparkle();">
    <div class="icon">✨</div>
    <div class="label">Sparkle Door</div>
    <div class="sub">For play</div>
  </a>
</div>

<div style="position:fixed;bottom:8px;right:12px;z-index:999">
  <a href="../planetary-onboard.html" style="font-size:10px;color:#999;text-decoration:none;letter-spacing:0.5px;opacity:0.4">🔧</a>
</div>

<script>
(function(){
  if (window.__onboard && window.__onboard.delta()) {
    window.location.href = 'delta/';
    return;
  }
  var d = window.__onboard && window.__onboard.door();
  if (d === 'warm') document.querySelector('.door-warm').style.border = '3px solid #EA580C';
  if (d === 'sparkle') document.querySelector('.door-sparkle').style.border = '3px solid #9333EA';
})();
</script>
</body>
</html>
