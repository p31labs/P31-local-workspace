<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Reward — P31</title>
<script src="../../state.js"></script>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { height: 100%; overflow: hidden; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif; -webkit-tap-highlight-color: transparent; }
body { background: linear-gradient(135deg, #E0F2FE 0%, #C084FC 50%, #F0ABFC 100%); display: flex; align-items: center; justify-content: center; padding: 20px; }
.card { background: rgba(255,255,255,0.3); backdrop-filter: blur(8px); border-radius: 48px; padding: 36px 28px; max-width: 420px; width: 100%; text-align: center; box-shadow: 0 20px 60px rgba(147,51,234,0.2); border: 1px solid rgba(255,255,255,0.3); }
.hearts { font-size: clamp(40px, 10vw, 64px); margin-bottom: 12px; animation: float 1s ease-out; }
@keyframes float { 0%{transform:translateY(40px);opacity:0;} 100%{transform:translateY(0);opacity:1;} }
h1 { font-size: clamp(24px, 6vw, 36px); font-weight: 800; color: #4C1D95; margin-bottom: 8px; }
p { font-size: clamp(18px, 4.5vw, 24px); color: #6D28D9; opacity: 0.8; margin-bottom: 8px; }
.love-count { font-size: clamp(36px, 9vw, 56px); font-weight: 800; color: #EC4899; margin-bottom: 20px; }
.btn { display: inline-block; padding: 18px 40px; border-radius: 40px; font-size: clamp(18px, 4.5vw, 24px); font-weight: 700; text-decoration: none; background: linear-gradient(135deg, #EC4899, #F472B6); color: white; transition: all 0.2s; }
.btn:active { transform: scale(0.95); }
.faces { display: flex; justify-content: center; gap: 16px; margin-bottom: 20px; }
.face { font-size: clamp(40px, 10vw, 64px); padding: 12px; border-radius: 50%; cursor: pointer; transition: all 0.2s; background: rgba(255,255,255,0.3); }
.face:active { transform: scale(0.9); background: rgba(255,255,255,0.6); }
</style>
</head>
<body>
<div class="card">
  <div class="hearts">❤️❤️❤️❤️❤️</div>
  <h1>You earned LOVE!</h1>
  <div class="love-count" id="loveCount">5</div>
  <p>Now find a friend on the mesh!</p>
  <div class="faces">
    <div class="face" onclick="pick(this,'👨🏽','Dad')">👨🏽</div>
    <div class="face" onclick="pick(this,'👩🏽','Mom')">👩🏽</div>
    <div class="face" onclick="pick(this,'👧🏽','S.J.')">👧🏽</div>
    <div class="face" onclick="pick(this,'👦🏽','W.J.')">👦🏽</div>
  </div>
  <div id="selectedMsg" style="font-size:18px;color:#4C1D95;margin-bottom:16px;min-height:28px"></div>
  <a id="nextBtn" href="../delta/" class="btn" style="display:none" onclick="window.__onboard.complete();window.__sfx.done();">You're on the team! 🎉</a>
</div>

<script>
window.__onboard.step(3);
var love = window.__onboard.love() || 5;
document.getElementById('loveCount').textContent = love;

function pick(el, emoji, name) {
  document.querySelectorAll('.face').forEach(function(f){ f.style.border = 'none'; f.style.background = 'rgba(255,255,255,0.3)'; });
  el.style.border = '3px solid #EC4899';
  el.style.background = 'rgba(255,255,255,0.6)';
  document.getElementById('selectedMsg').textContent = '✨ You connected with ' + name + '! ✨';
  window.__onboard.name(name);
  window.__sfx && window.__sfx.chime && window.__sfx.chime();
  document.getElementById('nextBtn').style.display = 'inline-block';
}
</script>
</body>
</html>
