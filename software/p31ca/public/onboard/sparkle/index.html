<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Sparkle Door — P31</title>
<script src="../../state.js"></script>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { height: 100%; overflow: hidden; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif; -webkit-tap-highlight-color: transparent; }
body { background: linear-gradient(135deg, #E0F2FE 0%, #C084FC 50%, #F0ABFC 100%); display: flex; align-items: center; justify-content: center; padding: 20px; }
.card { background: rgba(255,255,255,0.3); backdrop-filter: blur(8px); border-radius: 48px; padding: 48px 32px; max-width: 420px; width: 100%; text-align: center; box-shadow: 0 20px 60px rgba(147,51,234,0.2); border: 1px solid rgba(255,255,255,0.3); }
.star { font-size: min(40vw, 200px); cursor: pointer; display: block; user-select: none; margin: 0 auto 16px; animation: bounce 1.5s ease-in-out infinite; }
.star:active { transform: scale(0.85); }
@keyframes bounce { 0%,100%{transform:translateY(0) scale(1);} 30%{transform:translateY(-12px) scale(1.05);} 50%{transform:translateY(0) scale(1);} 70%{transform:translateY(-6px) scale(1.02);} }
h1 { font-size: clamp(28px, 7vw, 48px); font-weight: 800; color: #4C1D95; margin-bottom: 8px; }
p { font-size: clamp(18px, 4.5vw, 24px); color: #6D28D9; opacity: 0.8; margin-bottom: 24px; }
.btn { display: inline-block; padding: 20px 48px; border-radius: 60px; font-size: clamp(20px, 5vw, 28px); font-weight: 700; text-decoration: none; transition: all 0.2s; background: linear-gradient(135deg, #9333EA, #C084FC); color: white; box-shadow: 0 8px 24px rgba(147,51,234,0.3); }
.btn:active { transform: scale(0.95); }
.skip { position: fixed; bottom: 20px; right: 20px; font-size: 14px; color: #5B21B6; opacity: 0.4; text-decoration: none; }
</style>
</head>
<body>
<div class="card">
  <div class="star" id="starEl" onclick="explode(this)">✨</div>
  <h1>Let's Play!</h1>
  <p>Tap the star to begin your adventure!</p>
  <a href="pick.html" class="btn" onclick="window.__onboard.step(1);window.__sfx.sparkle();">Start →</a>
</div>
<a href="../warm/" class="skip" onclick="window.__onboard.door('warm')">❤️</a>

<script>
window.__onboard.door('sparkle');
window.__onboard.step(0);

function explode(el) {
  window.__sfx && window.__sfx.sparkle && window.__sfx.sparkle();
  el.style.animation = 'none';
  el.offsetHeight;
  el.style.transition = 'transform 0.3s';
  el.style.transform = 'scale(2) rotate(180deg)';
  el.style.opacity = '0';
  setTimeout(function(){
    el.style.transition = 'none';
    el.style.transform = 'scale(1) rotate(0deg)';
    el.style.opacity = '1';
    el.style.animation = 'bounce 1.5s ease-in-out infinite';
  }, 400);
  // create sparkle particles
  for (var i = 0; i < 12; i++) {
    var s = document.createElement('span');
    s.textContent = ['✨','⭐','🌟','💫'][Math.floor(Math.random()*4)];
    s.style.cssText = 'position:fixed;font-size:24px;pointer-events:none;z-index:999;transition:all 0.8s ease-out;left:'+(window.innerWidth/2)+'px;top:'+(window.innerHeight/2)+'px';
    document.body.appendChild(s);
    var angle = (i / 12) * 360;
    var dist = 80 + Math.random() * 120;
    var tx = Math.cos(angle * Math.PI / 180) * dist;
    var ty = Math.sin(angle * Math.PI / 180) * dist;
    requestAnimationFrame(function(){ s.style.transform = 'translate('+tx+'px,'+ty+'px)'; s.style.opacity = '0'; });
    setTimeout(function(){ s.remove(); }, 900);
  }
}
</script>
</body>
</html>
