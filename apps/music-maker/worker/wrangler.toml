# The music maker — presence Worker. The production transport for the
# log/presence split (§6 Option B): a Durable Object per music room with
# WebSocket Hibernation — the DO sleeps when idle (no billable Duration) and
# wakes to broadcast. Committed events go through the D1 log path.
name = "music-presence"
main = "index.ts"
compatibility_date = "2026-07-04"
compatibility_flags = ["nodejs_compat"]

workers_dev = true

[observability]
enabled = true

# CONFIG REQUIRED — a D1 database for the committed composition log.
# Create with: wrangler d1 create music-maker
# Then paste the id below and run `wrangler d1 migrations apply music-maker`.
# The schema mirrors the Loom's events table (schema.sql).
[[d1_databases]]
binding = "MUSIC_D1"
database_name = "music-maker"
# CONFIG REQUIRED — replace with the id from `wrangler d1 create music-maker`.
database_id = "REPLACE_WITH_D1_ID"

[durable_objects]
bindings = [
  { name = "MUSIC_ROOM", class_name = "MusicRoom" },
]

# The modern runtime declaration for a Hibernation WebSocket DO. Without the
# `exports` entry, the runtime does not route the Hibernation handlers
# (webSocketMessage / webSocketClose / getWebSockets) to this class — the
# frames never fan out. `storage = "legacy-kv"` gives the DO its durable state
# (needed to track hibernated sockets) WITHOUT DO-local SQLite — committed
# events still go through D1. If the room ever moves to DO SQLite, that's a
# separate decision taken before first deploy (changing storage later is not
# possible on a deployed class).
[exports.MusicRoom]
type = "durable-object"
storage = "legacy-kv"

# NO [[migrations]] entry: this DO writes through D1 (MUSIC_D1), not DO-local
# SQLite storage. new_sqlite_classes would enable storage the DO never calls,
# and per Cloudflare docs cannot be added to a class that has already deployed
# without it. If the room ever moves to DO SQLite, that's a separate decision
# taken before first deploy.

# A custom route/domain can be added later; workers.dev gives a reachable URL
# for testing. The client connects to /stream?room=<family-id>.