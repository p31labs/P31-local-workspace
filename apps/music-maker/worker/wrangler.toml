# The music maker — presence Worker. The production transport for the
# log/presence split (§6 Option B): a Durable Object per music room with
# WebSocket Hibernation — the DO sleeps when idle (no billable Duration) and
# wakes to broadcast. Committed events go through the D1 log path.
name = "music-presence"
main = "index.ts"
compatibility_date = "2026-07-04"
compatibility_flags = ["nodejs_compat"]

workers_dev = true

[observability]
enabled = true

# CONFIG REQUIRED — a D1 database for the committed composition log.
# Create with: wrangler d1 create music-maker
# Then paste the id below and run `wrangler d1 migrations apply music-maker`.
# The schema mirrors the Loom's events table (schema.sql).
[[d1_databases]]
binding = "MUSIC_D1"
database_name = "music-maker"
# CONFIG REQUIRED — replace with the id from `wrangler d1 create music-maker`.
database_id = "REPLACE_WITH_D1_ID"

[durable_objects]
bindings = [
  { name = "MUSIC_ROOM", class_name = "MusicRoom" },
]

# The modern runtime declaration for a Hibernation WebSocket DO. Without the
# `exports` entry, the runtime does not route the Hibernation handlers
# (webSocketMessage / webSocketClose / getWebSockets) to this class — the
# frames never fan out.
#
# `storage = "sqlite"` is REQUIRED by Cloudflare policy (changelog 2026-07-09):
# new Durable Object namespaces must use the SQLite storage backend; legacy-kv
# is only accepted for accounts that already provisioned a KV namespace. A
# fresh account has none — legacy-kv would fail first deploy. getWebSockets()
# survives hibernation on ANY backend, so SQLite changes nothing about the
# room's socket tracking. Committed events still go through D1 (MUSIC_D1 is a
# separate binding); DO SQLite is only the namespace backend, not a log store.
[exports.MusicRoom]
type = "durable-object"
storage = "sqlite"

# NO [[migrations]] entry: DO class lifecycle is handled by the [exports]
# declaration above (the modern declarative form). The DO writes committed
# events through D1 (MUSIC_D1), not DO-local SQLite; DO SQLite storage is the
# required namespace backend, nothing more.

# CONFIG REQUIRED — D1 setup is a USER action (needs your Cloudflare account):
#   wrangler d1 create music-maker        → gives a database_id
#   wrangler d1 execute music-maker --remote --file=schema.sql
# then paste that database_id below. The committed composition log lives here.

# A custom route/domain can be added later; workers.dev gives a reachable URL
# for testing. The client connects to /stream?room=<family-id>.