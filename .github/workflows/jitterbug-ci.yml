# ═══════════════════════════════════════════════════════════════════════════════
# Jitterbug CI — fast path for jitterbug-pwa and jitterbug-api
# ═══════════════════════════════════════════════════════════════════════════════

name: Jitterbug CI

permissions:
  contents: read

on:
  push:
    branches: [main]
    paths:
      - 'software/packages/jitterbug-pwa/**'
      - 'software/packages/jitterbug-api/**'
      - '.github/workflows/jitterbug-ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'software/packages/jitterbug-pwa/**'
      - 'software/packages/jitterbug-api/**'
      - '.github/workflows/jitterbug-ci.yml'
  workflow_dispatch:

concurrency:
  group: jitterbug-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Build & Validate Jitterbug Packages
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck jitterbug-api
        run: cd software/packages/jitterbug-api && pnpm run typecheck || echo "::warning::jitterbug-api typecheck skipped or failed"

      - name: Typecheck jitterbug-pwa
        run: cd software/packages/jitterbug-pwa && pnpm run typecheck || echo "::warning::jitterbug-pwa typecheck skipped or failed"

      - name: Build jitterbug-pwa
        run: cd software/packages/jitterbug-pwa && pnpm run build

      - name: Validate jitterbug-pwa dist
        run: |
          test -f software/packages/jitterbug-pwa/dist/index.html
          test -f software/packages/jitterbug-pwa/dist/manifest.webmanifest
          CSS_COUNT=$(find software/packages/jitterbug-pwa/dist -name "*.css" | wc -l)
          if [ "$CSS_COUNT" -eq 0 ]; then
            echo "::error::No CSS files in jitterbug-pwa dist/ — styling pipeline broken"
            exit 1
          fi
          echo "jitterbug-pwa build validated: $CSS_COUNT CSS file(s)"

      - name: Check jitterbug-api test suite
        run: cd software && pnpm turbo run test \
          --filter=@p31/jitterbug-api \
          --filter=@p31/jitterbug-pwa \
          --continue || echo "::warning::Some jitterbug tests failed or are missing"
