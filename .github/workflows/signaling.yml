name: p31-signaling

on:
  push:
    branches: [main]
    paths:
      - "workers/signaling/**"
      - ".github/actions/**"
      - ".github/workflows/signaling.yml"
  workflow_dispatch:

concurrency:
  group: signaling-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/toolchain-constants

      - name: Install wrangler globally
        run: npm install -g wrangler@${{ env.WRANGLER_VERSION }}

      - name: Deploy signaling worker
        uses: ./.github/actions/wrangler-run
        with:
          working-directory: workers/signaling
          command: deploy
          api-token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          account-id: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Smoke test
        run: |
          sleep 10
          CODE=$(curl -s -o /dev/null -w "%{http_code}" --max-time 15 \
            "https://p31-signaling.trimtab-signal.workers.dev/peers" 2>/dev/null || echo 000)
          if [[ "$CODE" == "200" ]]; then
            echo "✅ p31-signaling live"
          else
            echo "⚠ p31-signaling returned HTTP $CODE"
          fi
