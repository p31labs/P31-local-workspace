name: MCP Distribution Sweep

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  sweep:
    name: Smithery publish + ARD submit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Smithery publish (remote URL — requires SMITHERY_API_TOKEN secret)
        if: env.SMITHERY_API_TOKEN != ''
        env:
          SMITHERY_API_TOKEN: ${{ secrets.SMITHERY_API_TOKEN }}
        run: |
          npx -y @smithery/cli mcp publish "https://mcp-registry.trimtab-signal.workers.dev/mcp" -n trimtab-signal/mcp-marketplace
      - name: ARD manifest submit
        run: |
          pip install --break-system-packages -q ard-publish
          ard-publish validate .well-known/ard.json || true
          ard-publish submit mcp-registry.trimtab-signal.workers.dev || true