name: MARGE Design Audit

on:
  pull_request:
    branches: [main]
    paths:
      - 'apps/phos/src/surfaces/**'
      - 'apps/phos/src/components/**'
      - 'cli/marge-server.js'
  push:
    branches: [main]
    paths:
      - 'apps/phos/src/surfaces/**'
      - 'apps/phos/src/components/**'

jobs:
  marge-audit:
    name: Design Compliance Audit
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Detect changed surfaces
        id: changes
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            FILES=$(git diff --name-only origin/${{ github.base_ref }}...HEAD -- 'apps/phos/src/surfaces/*.tsx' 2>/dev/null || echo "")
          else
            FILES=$(git diff --name-only HEAD~1 -- 'apps/phos/src/surfaces/*.tsx' 2>/dev/null || echo "")
          fi
          if [ -z "$FILES" ]; then
            echo "surfaces=" >> "$GITHUB_OUTPUT"
            echo "count=0" >> "$GITHUB_OUTPUT"
            echo "mode=none"
          else
            echo "surfaces<<EOF" >> "$GITHUB_OUTPUT"
            echo "$FILES" >> "$GITHUB_OUTPUT"
            echo "EOF" >> "$GITHUB_OUTPUT"
            COUNT=$(echo "$FILES" | wc -l)
            echo "count=$COUNT" >> "$GITHUB_OUTPUT"
            echo "mode=changed ($COUNT files)"
          fi

      - name: Run MARGE audit (changed surfaces)
        if: steps.changes.outputs.count != '0'
        run: |
          echo "═══ MARGE Design Audit ═══"
          echo "Mode: ${{ steps.changes.outputs.mode }}"
          echo ""
          FAIL=0
          while IFS= read -r FILE; do
            if [ -z "$FILE" ]; then continue; fi
            RESULT=$(printf '{"jsonrpc":"2.0","id":1,"method":"tools/call","params":{"name":"design_expert_audit_surface","arguments":{"file":"%s"}}}\n' "$FILE" | node cli/marge-server.js 2>/dev/null)
            STATUS=$(echo "$RESULT" | python3 -c "import sys,json; d=json.load(sys.stdin); r=json.loads(d['result']['content'][0]['text']); print(r.get('status','error'))" 2>/dev/null)
            if [ "$STATUS" != "ok" ]; then
              echo "❌ $FILE — audit error"
              FAIL=1
              continue
            fi
            SCORE=$(echo "$RESULT" | python3 -c "import sys,json; d=json.load(sys.stdin); r=json.loads(d['result']['content'][0]['text']); print(r.get('score',0))" 2>/dev/null)
            HFAIL=$(echo "$RESULT" | python3 -c "import sys,json; d=json.load(sys.stdin); r=json.loads(d['result']['content'][0]['text']); print(r.get('summary',{}).get('hardFail',0))" 2>/dev/null)
            COMPLIANT=$(echo "$RESULT" | python3 -c "import sys,json; d=json.load(sys.stdin); r=json.loads(d['result']['content'][0]['text']); print(r.get('compliant',False))" 2>/dev/null)
            if [ "$COMPLIANT" = "True" ]; then
              echo "✅ $FILE — score $SCORE/100"
            else
              echo "❌ $FILE — score $SCORE/100 ($HFAIL hard-fail)"
              FAIL=1
              # Print top violations
              echo "$RESULT" | python3 -c "
import sys,json
d=json.load(sys.stdin)
r=json.loads(d['result']['content'][0]['text'])
for v in r.get('violations',[])[:5]:
    print(f'  L{v[\"line\"]}: [{v[\"rule\"]}] {v[\"message\"]}')
" 2>/dev/null
            fi
          done <<< "${{ steps.changes.outputs.surfaces }}"
          echo ""
          if [ "$FAIL" -eq 1 ]; then
            echo "::error::MARGE found hard-fail violations. Fix before merging."
            exit 1
          fi
          echo "All surfaces compliant."

      - name: Run MARGE audit (full report on push to main)
        if: github.event_name == 'push'
        run: |
          printf '{"jsonrpc":"2.0","id":1,"method":"tools/call","params":{"name":"design_expert_generate_report","arguments":{}}}\n' | node cli/marge-server.js 2>/dev/null | python3 -c "
import sys, json
d = json.load(sys.stdin)
r = json.loads(d['result']['content'][0]['text'])
s = r['summary']
print('═══ MARGE Full Report ═══')
print(f'Surfaces: {s[\"total\"]} | Compliant: {s[\"compliant\"]} | Score: {s[\"averageScore\"]}/100')
print(f'Hard-fail: {s[\"hardFailCount\"]} | Warnings: {s[\"warningCount\"]}')
for v in r.get('topViolations', [])[:5]:
    print(f'  {v[\"rule\"]}: {v[\"count\"]} occurrences')
"

      - name: Comment on PR
        if: github.event_name == 'pull_request' && failure()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const { execSync } = require('child_process');
            let report = '## MARGE Design Audit Failed\n\n';
            report += 'Some surfaces have hard-fail violations.\n\n';
            report += 'Run locally:\n```bash\nnode cli/marge-server.js\n```\n';
            report += 'Or use `design_expert_audit_surface` on each file.\n';
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: report
            });
