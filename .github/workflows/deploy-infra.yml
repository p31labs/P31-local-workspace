name: Deploy Infra (CWP-2026-050)

on:
  push:
    branches: [main]
    paths:
      - "scripts/deploy-infra.js"
      - ".github/workflows/deploy-infra.yml"
  workflow_dispatch:

concurrency:
  group: deploy-infra-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy-infra:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ee05f70c889cb6f876b9925257e3a2fa
      CLOUDFLARE_ZONE_ID: 3ba5eda28c73c52dc6f0c33a2a607aae
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Apply Cloudflare infra (idempotent)
        run: node scripts/deploy-infra.js --apply
