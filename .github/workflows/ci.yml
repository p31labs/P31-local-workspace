name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-k4:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        run: cd k4-worker && npm ci
      - name: Type check
        run: cd k4-worker && npx tsc --noEmit
      - name: Run unit tests
        run: cd k4-worker && npx vitest run

  test-buffer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        run: cd buffer-worker && npm ci
      - name: Type check
        run: cd buffer-worker && npx tsc --noEmit
      - name: Run unit tests
        run: cd buffer-worker && npx vitest run

  test-fawn:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        run: cd fawn-guard && npm ci
      - name: Type check
        run: cd fawn-guard && npx tsc --noEmit
      - name: Run unit tests
        run: cd fawn-guard && npx vitest run

  validate-openapi:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate OpenAPI spec
        run: |
          npm install -g @apidevtools/swagger-cli
          swagger-cli validate docs/openapi.yaml

  test-live-staging:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    env:
      LIVE_URL: ${{ secrets.STAGING_URL }}
      BUFFER_URL: ${{ secrets.STAGING_BUFFER_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        run: cd k4-worker && npm ci
      - name: Run live E2E tests
        run: cd k4-worker && npm run test:live

  lint-monorepo:
    name: Lint (root eslint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run eslint
        run: npx eslint .

  design-system-invariants:
    name: Design system invariants
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Hex gate (no hardcoded hex in production code)
        run: node scripts/smoke-hex-gate.mjs

  ground-truth:
    name: Ground truth verification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Verify ground truth
        run: node apps/p31ca/scripts/verify-ground-truth.mjs

  oqe-gate:
    name: OQE hard gate (non-blocking)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Run OQE hard gate
        run: bash scripts/oqe-hard-gate.sh || true
