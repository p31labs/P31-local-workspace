# Filtered typecheck, build, test, and optional remote cache for the core software packages.
# Caller should set TURBO_TOKEN / TURBO_TEAM on the job (e.g. from secrets) for remote step to run.
name: Turbo software core slice
description: typecheck + build + test + optional `turbo --remote` when TURBO_TOKEN is set

runs:
  using: composite
  steps:
    - name: Type check (core packages)
      shell: bash
      run: cd software && pnpm turbo run typecheck \
        --filter=@p31/shared \
        --filter=@p31/bonding \
        --filter=@p31ca/node-zero \
        --filter=@p31/spaceship-earth

    - name: Build packages
      shell: bash
      run: cd software && pnpm turbo run build \
        --filter=@p31ca/agent-engine \
        --filter=@p31/bonding \
        --filter=@p31ca/game-engine \
        --filter=@p31/harmonic-linter \
        --filter=@p31ca/love-ledger \
        --filter=@p31ca/node-zero \
        --filter=@p31ca/quantum-core \
        --filter=@p31/shared \
        --filter=@p31/spaceship-earth

    - name: Run tests (all green packages)
      shell: bash
      run: cd software && pnpm turbo run test \
        --filter=@p31ca/agent-engine \
        --filter=@p31/bonding \
        --filter=@p31ca/game-engine \
        --filter=@p31/harmonic-linter \
        --filter=@p31ca/love-ledger \
        --filter=@p31ca/node-zero \
        --filter=@p31ca/quantum-core \
        --filter=@p31/shared

    - name: Turborepo remote cache
      if: ${{ env.TURBO_TOKEN != '' }}
      shell: bash
      run: cd software && pnpm turbo run build \
        --filter=@p31/bonding \
        --filter=@p31ca/node-zero \
        --filter=@p31/spaceship-earth \
        --remote
